name: CodeQL

# Static analysis via GitHub code scanning. This workflow requires GitHub.com (or GHES with
# Advanced Security); it is expected to be inoperative on mirrors without CodeQL support.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1' # weekly, Monday 06:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    # Skip on GitHub Enterprise instances (no ubuntu-latest runner / CodeQL support there)
    # and on private repos (code scanning requires Advanced Security there). A job-level if
    # is evaluated before runner assignment, so the job never queues. Activates on its own
    # once the repository is public.
    if: github.server_url == 'https://github.com' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # the analyze step reads workflow-run info when uploading results
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          # Analyze source only; dist/index.js is a generated bundle of third-party code
          # and would drown real findings in library noise.
          config: |
            paths-ignore:
              - dist

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
