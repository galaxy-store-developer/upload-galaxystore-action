version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @actions/core 3.x is ESM-only; this project compiles to CommonJS.
      - dependency-name: '@actions/core'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) does not expose the compiler API ts-jest needs.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The internal GitHub Enterprise mirror lags behind github.com (as of November 2026 it
      # has actions/checkout only up to v4.2.2), and the same workflow files must run there,
      # so all updates of these two actions are ignored. Revisit when the mirror catches up:
      #   GH_HOST=github.sec.samsung.net gh api repos/actions/<name>/tags
      - dependency-name: 'actions/checkout'
      - dependency-name: 'actions/setup-node'
