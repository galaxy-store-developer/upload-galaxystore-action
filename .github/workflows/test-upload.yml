name: Test Galaxy Store Upload

on:
  workflow_dispatch: # manual trigger only
    inputs:
      asset-name:
        description: 'File name of the .apk/.aab asset to download from the v0.1-test-assets release'
        required: true
        default: 'app-release_v101.aab'
      rollout-rate:
        description: 'Staged rollout percentage (1-100)'
        required: true
        default: '10'
      disable-existing-rollout:
        description: 'Disable a staged rollout still below 100% on the LIVE version before enabling the new one'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    # CI_RUNNER_LABEL is a repository variable for GitHub Enterprise instances with
    # custom runner labels (e.g. code-linux); unset, it defaults to ubuntu-latest.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Downloads the chosen asset from the v0.1-test-assets release in this repository.
      # The host is derived from GITHUB_SERVER_URL so this works on github.com and GitHub Enterprise.
      - name: Download test binary
        run: |
          gh release download v0.1-test-assets --pattern "$ASSET_NAME" --repo "${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}"
          ls -l "$ASSET_NAME"
        env:
          ASSET_NAME: ${{ inputs.asset-name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Galaxy Store
        id: upload
        uses: ./
        with:
          access-token: ${{ secrets.GALAXY_ACCESS_TOKEN }}
          service-account-id: ${{ secrets.GALAXY_SERVICE_ACCOUNT_ID }}
          content-id: ${{ vars.GALAXY_CONTENT_ID }}
          package-path: ./${{ inputs.asset-name }}
          staged-rollout: true
          rollout-rate: ${{ inputs.rollout-rate }}
          disable-existing-rollout: ${{ inputs.disable-existing-rollout }}
          publication-type: '03'
          submit: false

      - name: Print binary seq
        if: steps.upload.outputs.binary-seq
        env:
          BINARY_SEQ: ${{ steps.upload.outputs.binary-seq }}
        run: |
          echo "Binary seq: $BINARY_SEQ"
